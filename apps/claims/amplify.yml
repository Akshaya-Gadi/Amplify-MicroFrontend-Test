version: 1
applications:
  - appRoot: apps/claims
    frontend:
      phases:
        preBuild:
          commands:
            - cd ../../
            - npm ci
        build:
          commands:
            - npm run build:claims
      artifacts:
        baseDirectory: apps/claims/dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
      customHeaders:
        - pattern: '**/*'
          headers:
            - key: 'Access-Control-Allow-Origin'
              value: '*'
